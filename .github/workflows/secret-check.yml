# Temporary. Delete once the CurseForge upload works.
#
# The 3.4.0 release uploaded to Wago and not to CurseForge, and the job went
# green either way: the packager prints "CurseForge ID: 1491616" without the
# "[token set]" it prints beside the Wago id, then quietly skips the upload.
# Something about CF_API_TOKEN is different from WAGO_API_TOKEN, and guessing
# which costs more than asking.
#
# Nothing here prints a secret. Lengths, and the HTTP status CurseForge answers
# with — enough to tell "never arrived" from "arrived and is not accepted",
# which are different problems with different fixes.

name: Secret check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Did the tokens arrive, and does CurseForge accept ours?
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          printf 'CF_API_TOKEN   length: %s\n' "${#CF_API_TOKEN}"
          printf 'WAGO_API_TOKEN length: %s\n' "${#WAGO_API_TOKEN}"

          # Whitespace at the ends is invisible in the settings page and fatal
          # in a header, so it gets its own line rather than being trimmed away
          # silently here.
          trimmed="$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"
          printf 'CF token length without whitespace: %s\n' "${#trimmed}"

          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CF_API_TOKEN is empty in this job — the secret is not reaching the workflow."
            exit 0
          fi

          status=$(curl -s -o /tmp/cf.json -w '%{http_code}' \
            -H "x-api-token: $CF_API_TOKEN" \
            "https://wow.curseforge.com/api/game/versions")
          echo "CurseForge /api/game/versions -> HTTP $status"
          head -c 200 /tmp/cf.json | sed 's/[[:alnum:]]\{20,\}/[redacted]/g'
          echo
          case "$status" in
            200) echo "The token works. The skip is somewhere else." ;;
            401|403) echo "::warning::CurseForge refuses this token — regenerate it in Author Dashboard, API Tokens." ;;
            *) echo "::warning::Unexpected status $status." ;;
          esac
