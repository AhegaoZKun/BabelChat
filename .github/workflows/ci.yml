name: CI

on:
  push:
    branches: [main, midnight]
  pull_request:
    branches: [main, midnight]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app/ tests/ .github/scripts/

      - name: Test
        run: pytest --junitxml=report.xml

      # A green pytest cannot tell "all tests pass" from "the tests are gone".
      # Ratchet: raising MIN_TESTS is free, lowering it has to be deliberate.
      # The number is junit's `tests` attribute — passed plus skipped, which is
      # one more than pytest's "collected N items" line.
      - name: Guard test count
        env:
          MIN_TESTS: "701"
        run: python .github/scripts/check_test_count.py report.xml ${{ env.MIN_TESTS }}
