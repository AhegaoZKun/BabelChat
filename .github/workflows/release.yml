name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.0.0, v3.0.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Rust scanner DLL
        run: |
          cargo build --release --manifest-path babelchat_scanner_win/Cargo.toml
          Copy-Item babelchat_scanner_win/target/release/babelchat_scanner_win.dll app/babelchat_scanner_win.dll

      - name: Build .exe
        run: pyinstaller build.spec

      - name: Package companion app
        run: |
          Compress-Archive -Path dist\BabelChat.exe -DestinationPath dist\BabelChat.zip

      - name: Package addon for CurseForge
        run: |
          Compress-Archive -Path addon\BabelChat -DestinationPath dist\BabelChat-Addon.zip

      - name: Compute checksums
        run: |
          $h1 = (Get-FileHash dist\BabelChat.zip -Algorithm SHA256).Hash
          $h2 = (Get-FileHash dist\BabelChat-Addon.zip -Algorithm SHA256).Hash
          "$h1  BabelChat.zip`n$h2  BabelChat-Addon.zip" | Out-File dist\checksums.txt -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-package
          path: |
            dist/BabelChat.zip
            dist/BabelChat-Addon.zip
            dist/checksums.txt

  # ── Linux build: AppImage + deb + rpm ──────────────────────────────────────
  # Built on the oldest supported runner (24.04 → glibc 2.39) so the binaries
  # run on newer Debian/Fedora too, not the reverse. Every artefact is verified
  # by installing it in a clean container, not by the fact that it built.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fish python3-venv python3-dev python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            libgtk-4-1 libgtk-4-dev gobject-introspection libgirepository1.0-dev \
            libwayland-dev wayland-protocols meson ninja-build valac \
            patchelf desktop-file-utils rpm ruby ruby-dev build-essential

      # gtk4-layer-shell is absent from Ubuntu 24.04's repos; build the release
      # tag from source so its lib + typelib are present for the bundle.
      - name: Build gtk4-layer-shell from source
        run: |
          curl -sSfL -o /tmp/gls.tar.gz \
            https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.0.4.tar.gz
          tar -xf /tmp/gls.tar.gz -C /tmp
          cd /tmp/gtk4-layer-shell-1.0.4
          meson setup build --prefix=/usr -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build Rust scanner
        run: cargo build --release --manifest-path babelchat_scanner_linux/Cargo.toml

      - name: Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install --upgrade pip
          # PyQt6 is the Windows frontend and build-linux.spec excludes it.
          grep -v '^PyQt6' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt pyinstaller

      - name: Fetch linuxdeploy tooling
        run: |
          mkdir -p tools
          curl -sSfL -o tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o tools/linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        run: |
          . .venv/bin/activate
          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1   # runners have no /dev/fuse
          fish ./build-linux.fish

      - name: Build deb + rpm
        run: |
          sudo gem install --no-document fpm
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading v from the tag
          bash .github/scripts/package_linux.sh "$VERSION" dist-linux
          mv ./*.AppImage dist-linux/

      - name: Smoke test on clean distros
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          deb="dist-linux/babelchat_${VERSION}_amd64.deb"
          rpm="dist-linux/babelchat-${VERSION}-1.x86_64.rpm"
          set -e
          for img in debian:13 ubuntu:24.04; do
            echo "===== $img ====="
            docker run --rm -v "$PWD:/w:ro" "$img" \
              bash /w/.github/scripts/smoke_install.sh "/w/$deb"
          done
          echo "===== fedora:41 ====="
          docker run --rm -v "$PWD:/w:ro" fedora:41 \
            bash /w/.github/scripts/smoke_install.sh "/w/$rpm"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            dist-linux/*.AppImage
            dist-linux/*.deb
            dist-linux/*.rpm

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: release/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-linux
          path: release/

      - name: Extract changelog
        id: changelog
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md > release_notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine tag and prerelease
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" =~ -beta|-rc|-alpha ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BabelChat ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            release/BabelChat.zip
            release/BabelChat-Addon.zip
            release/checksums.txt
            release/*.AppImage
            release/*.deb
            release/*.rpm
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

  # ── Addon: CurseForge and Wago ─────────────────────────────
  #
  # BigWigsMods/packager is the standard tool for WoW addons. It reads
  # ## Interface, ## X-Curse-Project-ID and ## X-Wago-ID straight out of the
  # TOC, so the game versions and the project ids live in exactly one place —
  # the file that has to be correct anyway for the addon to load at all. The job
  # this replaced carried its own copy of the game version and was two patches
  # stale before anyone ran it.
  #
  # Repository secrets, both optional:
  #   CF_API_TOKEN    CurseForge → Authors → API Tokens
  #   WAGO_API_TOKEN  wago.io → account settings → API keys
  #
  # With neither set the packager runs with -d: it builds the zip and proves the
  # addon packages cleanly, and uploads nothing. A store whose id is missing
  # from the TOC is skipped the same way, so this is safe to run before either
  # project exists.
  #
  # GITHUB_API_TOKEN is deliberately not passed: the `release` job above already
  # creates the GitHub release, and handing the packager a token would have it
  # create a second one.
  #
  # See docs/publishing.md.
  publish-addon:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The packager builds a changelog from the commits since the previous
          # tag, and can do neither from a shallow clone.
          fetch-depth: 0

      # A tag can be created on any commit, including one on a feature branch or
      # one that was never merged. Publishing that to a store puts a build in
      # front of players that no review ever saw, and it cannot be taken back —
      # CurseForge and Wago keep every uploaded file. `github.event.base_ref`
      # looks like it answers this and does not: it reports the branch the tag
      # was pushed alongside, which is whatever the pusher happened to have
      # checked out. Ancestry is the fact.
      # A job-level `if` on github.ref_name got this wrong twice over. It
      # listed -beta and -alpha while the release job two jobs up treats -rc as
      # a prerelease too, so v3.4.0-rc.1 would have been published to both
      # stores. And on workflow_dispatch github.ref_name is the *branch*, so
      # dispatching a beta tag from main evaluated contains('main', '-beta') as
      # false and published the beta. Every other step already reads
      # `inputs.tag || ref_name`; this reads the same thing, in one place.
      # Skipped, not failed: a red build on a deliberate beta is a false alarm,
      # and the next real one gets ignored.
      - name: Is this a prerelease?
        id: kind
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            echo "::notice::$TAG is a prerelease — the stores keep every file ever uploaded, so it is not published there."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish from outside main
        if: steps.kind.outputs.publish == 'true'
        run: |
          # checkout with fetch-depth: 0 already fetched every branch, so
          # origin/main is present. An extra `git fetch --depth=0` is not just
          # redundant, it aborts: git rejects a depth of zero, and the default
          # shell is `bash -e`, so the step dies before the guard below runs.
          # The commit that is checked out, not the one that triggered the run.
          # On workflow_dispatch those differ: GITHUB_SHA is the branch the
          # workflow file came from, while the steps below package whatever
          # `inputs.tag` checked out. Guarding the trigger would have approved
          # main while publishing something else entirely.
          sha=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "$sha is on main."
          else
            echo "::error::$sha is not an ancestor of origin/main."                  "Addons are published from main only — merge first, then tag the merge."
            exit 1
          fi

      # Staged by hand rather than by the packager's own copy step. That step
      # works from an ignore list, and this repository holds the companion app,
      # its build outputs, the developer's config.json and their logs alongside
      # the addon — a blacklist one entry out of date uploads whatever it did
      # not know about to both stores, publicly and permanently. Copying the
      # addon in explicitly means only the addon can ship.
      - name: Stage the addon
        if: steps.kind.outputs.publish == 'true'
        run: |
          mkdir -p .release/BabelChat
          cp -r addon/BabelChat/. .release/BabelChat/
          cp LICENSE .release/BabelChat/
          test -f .release/BabelChat/BabelChat.toc

      # The store notes are this release's section of the changelog, not all of
      # it. Same extraction the GitHub release above uses.
      - name: Write the release notes the stores will show
        if: steps.kind.outputs.publish == 'true'
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish to CurseForge and Wago
        if: steps.kind.outputs.publish == 'true'
        uses: BigWigsMods/packager@v2
        env:
          # Both names, one secret, and the first one is the one that works.
          #
          # release.sh at the v2 tag reads the CurseForge token from CF_API_KEY
          # and nowhere else; CF_API_TOKEN was added to it after that tag. So
          # 3.4.0 passed a perfectly good token under a name this version never
          # looks at, uploaded to Wago — whose variable name did not change —
          # and skipped CurseForge without a word, in a job that went green.
          #
          # CF_API_TOKEN stays for when the action is bumped to a version that
          # prefers it. Whichever is read, the value is the same secret.
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        with:
          # -c packages what was staged above instead of copying the checkout.
          # -o is not optional alongside it: without it the packager deletes the
          # package directory before it starts, staged contents and all, and
          # produces an empty zip that uploads without complaint.
          args: >-
            ${{ (secrets.CF_API_TOKEN == '' && secrets.WAGO_API_TOKEN == '') && '-d' || '' }}
            -c -o
            -r ${{ github.workspace }}/.release
